name: Deploy to cPanel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔨 Install & Build React Frontend
        working-directory: ./frontend
        run: |
          npm install --no-audit
          npm run build
          mkdir -p ../backend/public
          cp -r dist/* ../backend/public/

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, zip, gd

      - name: 📦 Install Backend Composer Dependencies
        working-directory: ./backend
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --ignore-platform-reqs

      - name: 🚀 Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: ./backend/
          server-dir: ${{ secrets.FTP_DIR || 'lessonplan.firoz-ahmed.com/' }}
          dangerous-clean-slate: false
          log-level: verbose
          exclude: |
            **/.git*
            storage/logs/*.log
            storage/app/public/submissions/*
            .env

      - name: 🔄 Auto-Migrate Database & Clear Cache on cPanel
        if: ${{ secrets.APP_DOMAIN != '' && secrets.DEPLOY_KEY != '' }}
        run: |
          echo "Triggering automated database migration on cPanel..."
          curl -k -s -X POST "https://${{ secrets.APP_DOMAIN }}/api/v1/system/auto-migrate?key=${{ secrets.DEPLOY_KEY }}" || echo "Migration webhook triggered"